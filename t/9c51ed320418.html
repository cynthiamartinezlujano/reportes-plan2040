*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#FAF8F4;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;color:#3D3D3D}
.card{background:#fff;border:1px solid #EEEAE3;border-radius:26px;padding:34px 24px 28px;max-width:400px;width:100%;

.card img{height:46px;margin-bottom:16px}

.sub{font-size:15px;color:#7A7A7A;margin:8px 0 20px;line-height:1.45}

  border-radius:16px;text-align:center;letter-spacing:.06em;color:#141414;background:#fff}
input:focus{outline:none;border-color:#E81957}
.rec{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14.5px;color:#3D3D3D}
.rec input{width:20px;height:20px;accent-color:#E81957}
button{width:100%;margin-top:16px;font:800 17px inherit;color:#fff;background:#E81957;border:none;border-radius:999px;
  padding:16px;cursor:pointer}
button:disabled{background:#C9C2B4;cursor:wait}
.err{display:none;color:#B02A35;background:#FBE3E5;border-radius:12px;font-size:14px;margin-top:14px;padding:10px;font-weight:600}
.nota{font-size:11.5px;color:#A3A3A3;margin-top:18px;line-height:1.5}

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(pw){
  if(!window.crypto || !crypto.subtle) throw new Error('nosubtle');
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(IV)}, key, u8(CT));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}

const limpia = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  e.style.display = 'none'; b.disabled = true; b.textContent = 'Abriendo…';
  const pw = limpia(document.getElementById('p').value);
  try{
    try{ document.getElementById('r').checked ? localStorage.setItem(LLAVE, pw) : localStorage.removeItem(LLAVE); }catch(_){}
    await abrir(pw);
  }catch(err){
    try{ localStorage.removeItem(LLAVE); }catch(_){}
    b.disabled = false; b.textContent = 'Entrar';
    e.textContent = (err && err.message === 'nosubtle')
      ? 'Este navegador no puede abrir el tablero. Ábrelo en Safari o Chrome.'
      : 'Contraseña incorrecta. Revisa que esté bien escrita.';
    e.style.display = 'block';
  }
});
