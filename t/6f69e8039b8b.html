<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Sora",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF6DE;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;color:#3D3D3D}
.logo{height:40px}
.ilus{width:230px;max-width:70vw;height:auto;margin:18px 0 6px}
h1{font-size:32px;font-weight:800;color:#141414;letter-spacing:-.03em;line-height:1.1;text-align:center}
.marca{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#946000;margin-top:6px;text-align:center}
.card{background:#fff;border-radius:26px;padding:22px 20px 20px;max-width:400px;width:100%;margin-top:22px;
  box-shadow:0 1px 3px rgba(20,20,20,.05),0 10px 30px rgba(148,96,0,.10);text-align:center}
.sub{font-size:16px;color:#3D3D3D;margin-bottom:14px;line-height:1.45}
.campo{position:relative}
.campo input{width:100%;font:700 20px/1.2 inherit;padding:16px 56px 16px 16px;border:2px solid #EEEAE3;
  border-radius:18px;text-align:center;letter-spacing:.05em;color:#141414;background:#FAF8F4}
.campo input:focus{outline:none;border-color:#E81957;background:#fff}
.ojo{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:14px;
  background:transparent;color:#7A7A7A;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ojo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rec{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;font-size:15px;color:#3D3D3D}
.rec input{width:22px;height:22px;accent-color:#E81957}
.entrar{width:100%;margin-top:16px;font:800 18px inherit;color:#fff;background:#E81957;border:none;border-radius:999px;
  padding:17px;cursor:pointer;box-shadow:0 8px 20px rgba(232,25,87,.25)}
.entrar:disabled{background:#C9C2B4;box-shadow:none;cursor:wait}
.err{display:none;color:#B02A35;background:#FBE3E5;border-radius:14px;font-size:14.5px;margin-top:14px;padding:11px;font-weight:600}
.nota{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:#946000;margin-top:18px}
.nota svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(pw){
  if(!window.crypto || !crypto.subtle) throw new Error('nosubtle');
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(IV)}, key, u8(CT));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
// se aceptan mayúsculas, espacios y guiones: solo cuentan letras y números
const limpia = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
document.getElementById('ojo').addEventListener('click', () => {
  const p = document.getElementById('p'), ver = p.type === 'password';
  p.type = ver ? 'text' : 'password';
  document.getElementById('ojo').setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  document.getElementById('ojo').style.color = ver ? '#E81957' : '#7A7A7A';
  p.focus();
});
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  e.style.display = 'none'; b.disabled = true; b.textContent = 'Abriendo…';
  const pw = limpia(document.getElementById('p').value);
  try{
    try{ document.getElementById('r').checked ? localStorage.setItem(LLAVE, pw) : localStorage.removeItem(LLAVE); }catch(_){}
    await abrir(pw);
  }catch(err){
    try{ localStorage.removeItem(LLAVE); }catch(_){}
    b.disabled = false; b.textContent = 'Entrar';
    e.textContent = (err && err.message === 'nosubtle')
      ? 'Este navegador no puede abrir el tablero. Ábrelo en Safari o Chrome.'
      : 'Contraseña incorrecta. Revisa que esté bien escrita.';
    e.style.display = 'block';
  }
});
// si el teléfono la recuerda, se abre solo
(async () => {
  let pw = null; try{ pw = localStorage.getItem(LLAVE); }catch(_){}
  if(!pw) return;
  document.getElementById('b').disabled = true; document.getElementById('b').textContent = 'Abriendo…';
  try{ await abrir(pw); }catch(_){
    try{ localStorage.removeItem(LLAVE); }catch(__){}
    document.getElementById('b').disabled = false; document.getElementById('b').textContent = 'Entrar';
  }
})();
