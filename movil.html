<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Envoltorio móvil: el visor embed.aspx de SharePoint no declara viewport, así
     que abierto directo en un celular se dibuja a 980px y se ve chiquito. Esta
     página sí lo declara y muestra el visor a pantalla completa, con el ancho real
     del teléfono. Uso: movil.html?u=<UniqueId del archivo>&t=<título opcional>.
     No contiene datos: el reporte sigue protegido por el inicio de sesión. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi tablero">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="assets/app/icon-180.png">
<link rel="icon" href="assets/app/icon-180.png">
<title>Mi tablero · Plan 20·40</title>
<style>
  html,body{margin:0;height:100%;background:#FAF8F4;overflow:hidden}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#3D3D3D}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}
  .msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;font-size:16px;line-height:1.5}
  .msg img{width:64px;height:64px;border-radius:16px}
  .msg b{color:#141414;font-size:18px}
  .rueda{width:30px;height:30px;border:3px solid #EEEAE3;border-top-color:#E81957;border-radius:50%;
    animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="msg" id="msg">
  <img src="assets/app/icon-180.png" alt="">
  <div class="rueda"></div>
  <div><b>Abriendo tu tablero…</b><br>La primera vez puede tardar unos segundos.</div>
</div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const u = (p.get("u") || "").trim();
  const t = (p.get("t") || "").trim().slice(0, 40);
  if(t) document.title = t + " · Plan 20·40";
  const msg = document.getElementById("msg");
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(u)){
    msg.innerHTML = '<img src="assets/app/icon-180.png" alt=""><div><b>Falta el enlace del reporte</b><br>Pide a tu coordinadora el enlace completo.</div>';
    return;
  }
  const f = document.createElement("iframe");
  f.title = t || "Reporte";
  f.allow = "geolocation; fullscreen";
  f.src = "https://qualfon-my.sharepoint.com/personal/cynthia_martinez_qualfon_com/_layouts/15/embed.aspx?UniqueId=" + u;
  document.body.appendChild(f);
})();
</script>
</body>
</html>
